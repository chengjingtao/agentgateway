# connect-wildcard-port must name a port listed in internal-ports; otherwise the Gateway is
# not accepted and no bind is turned into the wildcard (port 3000 keeps its port).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: default
  annotations:
    agentgateway.dev/internal-ports: "8443"
    agentgateway.dev/connect-wildcard-port: "3000"
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: connect
      port: 3000
      protocol: HTTP
    - name: mitm
      port: 8443
      protocol: HTTP

---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    bind:
      key: 3000/default/test-gateway
      port: 3000
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    bind:
      key: 8443/default/test-gateway
      mode: INTERNAL
      port: 8443
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    listener:
      bindKey: 3000/default/test-gateway
      key: default/test-gateway.connect
      name:
        gatewayName: test-gateway
        gatewayNamespace: default
        listenerName: connect
      protocol: HTTP
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    listener:
      bindKey: 8443/default/test-gateway
      key: default/test-gateway.mitm
      name:
        gatewayName: test-gateway
        gatewayNamespace: default
        listenerName: mitm
      protocol: HTTP
