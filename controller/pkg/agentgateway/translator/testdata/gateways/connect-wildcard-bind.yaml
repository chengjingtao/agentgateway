# agentgateway.dev/connect-wildcard-port makes the internal bind on 8443 the CONNECT
# re-entry wildcard bind: it is sent with port 0, while its key (and the listener's
# bindKey) keep the declared port.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: default
  annotations:
    agentgateway.dev/internal-ports: "8443"
    agentgateway.dev/connect-wildcard-port: "8443"
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: connect
      port: 3000
      protocol: HTTP
    - name: mitm
      port: 8443
      protocol: HTTP

---
# Output
output:
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    bind:
      key: 3000/default/test-gateway
      port: 3000
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    bind:
      key: 8443/default/test-gateway
      mode: INTERNAL
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    listener:
      bindKey: 3000/default/test-gateway
      key: default/test-gateway.connect
      name:
        gatewayName: test-gateway
        gatewayNamespace: default
        listenerName: connect
      protocol: HTTP
- gateway:
    Name: test-gateway
    Namespace: default
  resource:
    listener:
      bindKey: 8443/default/test-gateway
      key: default/test-gateway.mitm
      name:
        gatewayName: test-gateway
        gatewayNamespace: default
        listenerName: mitm
      protocol: HTTP
