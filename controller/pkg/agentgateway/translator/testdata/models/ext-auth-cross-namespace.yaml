# Model-level extAuth (S2-AGW-01, S2-AGW-02): each concrete model carries its own
# ext_authz backend policy with its own contextExtensions; a failover virtual model
# reuses each target model's inline policies. The Broker Service lives in another
# namespace and is allowed by a ReferenceGrant from AgentgatewayModel.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-extauth
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: llm
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      namespaces:
        from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-credential-broker
  namespace: broker
spec:
  ports:
  - port: 9000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: models-to-broker
  namespace: broker
spec:
  from:
  - group: agentgateway.dev
    kind: AgentgatewayModel
    namespace: default
  to:
  - group: ""
    kind: Service
    name: mcp-credential-broker
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: provider-a
  namespace: default
spec:
  parentRefs:
  - name: model-extauth
    sectionName: llm
  match:
    model: '*'
  provider: OpenAI
  policies:
    extAuth:
      backendRef:
        kind: Service
        name: mcp-credential-broker
        namespace: broker
        port: 9000
      failureMode: FailClosed
      grpc:
        contextExtensions:
          targetKind: AgentgatewayModel
          target: default/provider-a
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: provider-b
  namespace: default
spec:
  parentRefs:
  - name: model-extauth
    sectionName: llm
  match:
    model: gemini-*
  provider: OpenAI
  policies:
    extAuth:
      backendRef:
        kind: Service
        name: mcp-credential-broker
        namespace: broker
        port: 9000
      failureMode: FailClosed
      grpc:
        contextExtensions:
          targetKind: AgentgatewayModel
          target: default/provider-b
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: resilient
  namespace: default
spec:
  parentRefs:
  - name: model-extauth
    sectionName: llm
  virtualModel:
    failover:
      targets:
      - modelRef:
          name: provider-a
        model: gpt-x
        priority: 0
      - modelRef:
          name: provider-b
        model: gemini-x
        priority: 1

---
